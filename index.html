        #status.outside { background-color: #fed7d7; color: #742a2a; border: 1px solid #feb2b2; display: block; }

    let map;
    let marker;

    // Dynamically inject the Google Maps API script with callback
    function loadGoogleMaps() {
        const script = document.createElement("script");
        // REPLACE YOUR_API_KEY WITH YOUR ACTUAL GOOGLE MAPS API KEY
        script.src = "https://maps.googleapis.com/maps/api/js?key=AIzaSyBCnFOrSS9cHJjJOKQ8Nsp0unHZs_IsYu0&libraries=geometry&callback=initMap";
        script.async = true;
        script.defer = true;
        document.head.appendChild(script);
    }

    // Google Maps triggers initMap() once the library has finished loading
    window.initMap = function() {
        map = new google.maps.Map(document.getElementById('map'), {
            zoom: 12,
            center: { lat: 38.2500, lng: -85.6500 },
            disableDefaultUI: true,
            zoomControl: true
        });

        map.data.addGeoJson(geojsonData);

        map.data.setStyle({
            fillColor: '#003366',
            fillOpacity: 0.25,
            strokeColor: '#001f3f',
            strokeWeight: 2
        });

        const bounds = new google.maps.LatLngBounds();
        map.data.forEach(function(feature) {
            feature.getGeometry().forEachLatLng(function(latLng) {
                bounds.extend(latLng);
            });
        });
        map.fitBounds(bounds);
    };

    function verifyAddress() {
        const address = document.getElementById('addressInput').value.trim();
        const statusDiv = document.getElementById('status');

        if (!address) {
            statusDiv.className = 'outside';
            statusDiv.innerHTML = '⚠️ Please enter an address to verify.';
            return;
        }

        statusDiv.className = 'loading';
        statusDiv.innerHTML = '🔍 Checking address...';

        const geocoder = new google.maps.Geocoder();

        const searchAddress = address.toLowerCase().includes('ky') || address.toLowerCase().includes('kentucky') 
            ? address 
            : address + ', Louisville, KY';

        geocoder.geocode({ address: searchAddress }, function(results, status) {
            if (status === 'OK' && results[0]) {
                const location = results[0].geometry.location;
                let isInside = false;

                map.data.forEach(function(feature) {
                    const geometry = feature.getGeometry();
                    
                    if (geometry.getType() === 'Polygon') {
                        const poly = new google.maps.Polygon({
                            paths: geometry.getArray().map(ring => ring.getArray())
                        });
                        if (google.maps.geometry.poly.containsLocation(location, poly)) {
                            isInside = true;
                        }
                    } else if (geometry.getType() === 'MultiPolygon') {
                        geometry.getArray().forEach(polygon => {
                            const poly = new google.maps.Polygon({
                                paths: polygon.getArray().map(ring => ring.getArray())
                            });
                            if (google.maps.geometry.poly.containsLocation(location, poly)) {
                                isInside = true;
                            }
                        });
                    }
                });

                if (isInside) {
                    statusDiv.className = 'inside';
                    statusDiv.innerHTML = '✅ IN DISTRICT: Address is WITHIN the STMFDKY service area.';
                } else {
                    statusDiv.className = 'outside';
                    statusDiv.innerHTML = '❌ OUT OF DISTRICT: Address is OUTSIDE the STMFDKY service area.';
                }

                if (marker) marker.setMap(null);
                marker = new google.maps.Marker({
                    position: location,
                    map: map,
                    title: address
                });

                map.setCenter(location);
                map.setZoom(15);

            } else {
                statusDiv.className = 'outside';
                statusDiv.innerHTML = '❌ Address not found. Check spelling or street number.';
            }
        });
    }

    // Execute script loading
    loadGoogleMaps();
